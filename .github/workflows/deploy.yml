name: Automated VPS Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy on local self-hosted runner
        run: |
          cd /var/www/jobhouse
          git pull origin main
          npm install --production
          npm run build --if-present
          pm2 restart jobhouse || pm2 start app.js --name "jobhouse"